<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Techsavey home page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading Techsavey home page...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<img src=\"b04e2abf-8400-4366-88b7-e48ab22a58bb\" alt=\"Techsavey\" style=\"display: block; height: 64px; width: auto; max-width: 100%; mix-blend-mode: multiply\">\n<a href=\"#contact\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border: 1px solid #2F5F7E; border-radius: 6px; color: #2F5F7E; font-weight: 500; font-size: 15px; text-decoration: none\">Complimentary check-up<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Hero -->\n<div style=\"background: #16212B; color: #F4F6F8\">\n<div style=\"max-width: 1160px; margin: 0 auto; width: 100%; box-sizing: border-box; padding: 56px 24px 88px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px\">\n<div style=\"flex: 1 1 460px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 24px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #7FB3D5\">Technology and client communication for small organizations<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(38px, 5.4vw, 64px); line-height: 1.04; letter-spacing: -0.02em; text-wrap: balance\">The technical side of your organization, handled.<\u002Fh1>\n<p style=\"margin: 0; font-size: 20px; line-height: 1.55; color: #C8D6E0; max-width: 540px\">Techsavey builds websites, runs the systems and keeps records clean for law firms, advisory practices and ministries. It also writes the messages that keep clients and donors in touch.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding-top: 8px\">\n<a href=\"#contact\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 26px; background: #7FB3D5; color: #1F262C; font-weight: 600; font-size: 16px; text-decoration: none; border-radius: 6px\">Request a complimentary check-up<\u002Fa>\n<a href=\"#services\" style=\"color: #F4F6F8; font-size: 16px; text-decoration: underline; text-underline-offset: 4px\">See what Techsavey does<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Who it is for -->\n<div id=\"clients\" style=\"scroll-margin-top: 24px\">\n<div style=\"max-width: 1160px; margin: 0 auto; width: 100%; box-sizing: border-box; padding: 80px 24px 0; display: flex; flex-direction: column; gap: 32px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #2F5F7E; font-weight: 500\">Who Techsavey works with<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px 48px\">\n<div style=\"flex: 1 1 280px; min-width: 0; border-top: 1px solid #B9CBDA; padding-top: 18px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 24px; line-height: 1.15\">Law firms<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #424C55\">Websites, email and the everyday systems a small firm relies on, set up so clients can find the firm and reach it.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0; border-top: 1px solid #B9CBDA; padding-top: 18px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 24px; line-height: 1.15\">Advisory and accounting practices<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #424C55\">Client communication, reminders and organized records, with the technical setup that keeps them running.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0; border-top: 1px solid #B9CBDA; padding-top: 18px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 24px; line-height: 1.15\">Ministries and nonprofits<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #424C55\">Donor letters, email and text follow-up, and clean donor data, from first gift to lasting partnership.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Services -->\n<div id=\"services\" style=\"scroll-margin-top: 24px\">\n<div style=\"max-width: 1160px; margin: 0 auto; width: 100%; box-sizing: border-box; padding: 88px 24px 72px; display: flex; flex-direction: column; gap: 40px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(30px, 4vw, 44px); line-height: 1.08; letter-spacing: -0.015em; text-wrap: balance; max-width: 720px\">What Techsavey does for small organizations<\u002Fh2>\n<div style=\"display: flex; flex-direction: column\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px 48px; padding: 30px 0; border-top: 1px solid #B9CBDA\">\n<h3 style=\"margin: 0; flex: 0 1 340px; min-width: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">Websites<\u002Fh3>\n<p style=\"margin: 0; flex: 1 1 360px; min-width: 0; font-size: 18px; line-height: 1.6; color: #424C55\">Clear, fast sites for law firms, advisory practices and ministries, built from scratch and kept up to date.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px 48px; padding: 30px 0; border-top: 1px solid #B9CBDA\">\n<h3 style=\"margin: 0; flex: 0 1 340px; min-width: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">Systems and IT support<\u002Fh3>\n<p style=\"margin: 0; flex: 1 1 360px; min-width: 0; font-size: 18px; line-height: 1.6; color: #424C55\">Email, accounts, devices and day-to-day technical help, set up properly and fixed quickly when something breaks.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px 48px; padding: 30px 0; border-top: 1px solid #B9CBDA\">\n<h3 style=\"margin: 0; flex: 0 1 340px; min-width: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">Clean, organized records<\u002Fh3>\n<p style=\"margin: 0; flex: 1 1 360px; min-width: 0; font-size: 18px; line-height: 1.6; color: #424C55\">One accurate record per client or donor, merged from your platforms and spreadsheets and grouped the way you work. Bounced addresses are chased down and fixed.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px 48px; padding: 30px 0; border-top: 1px solid #B9CBDA\">\n<h3 style=\"margin: 0; flex: 0 1 340px; min-width: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">Client and donor communication<\u002Fh3>\n<p style=\"margin: 0; flex: 1 1 360px; min-width: 0; font-size: 18px; line-height: 1.6; color: #424C55\">Letters, emails and texts in your organization's own voice: thank-yous, reminders, campaigns and personal messages for thousands of people at a time.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px 48px; padding: 30px 0; border-top: 1px solid #B9CBDA; border-bottom: 1px solid #B9CBDA\">\n<h3 style=\"margin: 0; flex: 0 1 340px; min-width: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">Automation<\u002Fh3>\n<p style=\"margin: 0; flex: 1 1 360px; min-width: 0; font-size: 18px; line-height: 1.6; color: #424C55\">The links between forms, spreadsheets, email and file storage that remove copy-and-paste work and keep follow-up on schedule.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Work -->\n<div id=\"work\" style=\"background: #D2E1EC; scroll-margin-top: 24px\">\n<div style=\"max-width: 1160px; margin: 0 auto; width: 100%; box-sizing: border-box; padding: 80px 24px; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(30px, 4vw, 44px); line-height: 1.08; letter-spacing: -0.015em; text-wrap: balance; max-width: 720px\">From recent work<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #424C55\">Client names are kept private.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 40px 48px\">\n<div style=\"flex: 1 1 240px; min-width: 0; border-top: 2px solid #2F5F7E; padding-top: 18px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 56px; line-height: 1; color: #2F5F7E; font-variant-numeric: tabular-nums\">4,500<\u002Fdiv>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #2A333B\">givers matched to birth dates across six donor lists, producing about 3,300 new individual messages. Conflicting matches went to a review list instead of being guessed.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 240px; min-width: 0; border-top: 2px solid #2F5F7E; padding-top: 18px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 56px; line-height: 1; color: #2F5F7E; font-variant-numeric: tabular-nums\">95,000<\u002Fdiv>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #2A333B\">donor records matched to a year of payments, then sorted by months since last gift so each donor appears in exactly one group.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 240px; min-width: 0; border-top: 2px solid #2F5F7E; padding-top: 18px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 56px; line-height: 1; color: #2F5F7E; font-variant-numeric: tabular-nums\">69,000<\u002Fdiv>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #2A333B\">contacts in a segment of recently active people, compared against a 330,000-contact list before the client chose who to email.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 240px; min-width: 0; border-top: 2px solid #2F5F7E; padding-top: 18px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 56px; line-height: 1; color: #2F5F7E; font-variant-numeric: tabular-nums\">6<\u002Fdiv>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #2A333B\">sections on a New York litigation firm's website: home, practice areas, appellate work, news, publications and contact.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- How it starts -->\n<div id=\"start\" style=\"scroll-margin-top: 24px\">\n<div style=\"max-width: 1160px; margin: 0 auto; width: 100%; box-sizing: border-box; padding: 88px 24px 80px; display: flex; flex-direction: column; gap: 40px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(30px, 4vw, 44px); line-height: 1.08; letter-spacing: -0.015em; text-wrap: balance; max-width: 720px\">How working together starts<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 40px 48px\">\n<div style=\"flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; color: #2F5F7E\">Step 1<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">A complimentary check-up<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #424C55\">Techsavey reviews your website, your systems and how you stay in touch with clients or donors, then sends back a one-page note with three changes and one rewritten message.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; color: #2F5F7E\">Step 2<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">One small pilot<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #424C55\">A single website, system fix, follow-up sequence or data clean-up, with scope, price and data handling agreed in writing before work begins.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; color: #2F5F7E\">Step 3<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">Steady monthly support<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #424C55\">Ongoing technical help, follow-up and data care. Each client's records stay separate and are never shared.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Contact -->\n<div id=\"contact\" style=\"background: #16212B; color: #F4F6F8; scroll-margin-top: 0\">\n<div style=\"max-width: 1160px; margin: 0 auto; width: 100%; box-sizing: border-box; padding: 80px 24px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 48px 56px\">\n<div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 24px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.06; letter-spacing: -0.02em; text-wrap: balance; max-width: 760px\">Start with a complimentary check-up<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px; line-height: 1.55; color: #C8D6E0; max-width: 600px\">Send Techsavey a link to your website and a few recent messages to clients or donors. You get back a one-page note with what to change and one rewritten message to see the difference.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 4px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #7FB3D5\">Or email directly<\u002Fdiv>\n<a href=\"mailto:jforeman@techsavey.com\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: #F4F6F8; text-underline-offset: 4px\">jforeman@techsavey.com<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<form id=\"ts-contact-form\" data-endpoint=\"https://api.web3forms.com/submit\" data-access-key=\"b76ab6a3-b749-46af-9e91-249d3c5a814e\" data-mailto=\"jforeman@techsavey.com\" novalidate=\"\" style=\"flex: 1 1 400px; min-width: 0; box-sizing: border-box; background: #EEF4F8; color: #1F262C; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #505B65\">Send a message<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 18px\">\n<label style=\"flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 500\"><span>Name <span style=\"font-weight: 400; color: #505B65; font-size: 14px\">(required)<\u002Fspan><\u002Fspan>\n<input class=\"ts-field\" name=\"name\" type=\"text\" required=\"\" maxlength=\"100\" autocomplete=\"name\" style=\"box-sizing: border-box; width: 100%; min-height: 46px; padding: 10px 12px; font: 400 16px/1.4 'IBM Plex Sans', system-ui, sans-serif; color: #1F262C; background: #FFFFFF; border: 1px solid #9DB3C5; border-radius: 6px\">\n<\u002Flabel>\n<label style=\"flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 500\"><span>Email <span style=\"font-weight: 400; color: #505B65; font-size: 14px\">(required)<\u002Fspan><\u002Fspan>\n<input class=\"ts-field\" name=\"email\" type=\"email\" required=\"\" maxlength=\"250\" autocomplete=\"email\" style=\"box-sizing: border-box; width: 100%; min-height: 46px; padding: 10px 12px; font: 400 16px/1.4 'IBM Plex Sans', system-ui, sans-serif; color: #1F262C; background: #FFFFFF; border: 1px solid #9DB3C5; border-radius: 6px\">\n<\u002Flabel>\n<\u002Fdiv>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 500\">Subject\n<input class=\"ts-field\" name=\"subject\" type=\"text\" maxlength=\"200\" style=\"box-sizing: border-box; width: 100%; min-height: 46px; padding: 10px 12px; font: 400 16px/1.4 'IBM Plex Sans', system-ui, sans-serif; color: #1F262C; background: #FFFFFF; border: 1px solid #9DB3C5; border-radius: 6px\">\n<\u002Flabel>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 500\">Message\n<textarea class=\"ts-field\" name=\"message\" rows=\"6\" style=\"box-sizing: border-box; width: 100%; min-height: 150px; padding: 10px 12px; font: 400 16px/1.5 'IBM Plex Sans', system-ui, sans-serif; color: #1F262C; background: #FFFFFF; border: 1px solid #9DB3C5; border-radius: 6px; resize: vertical\"><\u002Ftextarea>\n<\u002Flabel>\n<input type=\"checkbox\" name=\"botcheck\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\" style=\"display: none\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px\">\n<p id=\"ts-contact-status\" role=\"status\" aria-live=\"polite\" style=\"margin: 0; flex: 1 1 220px; min-width: 0; font-size: 15px; line-height: 1.45; color: #424C55\"><\u002Fp>\n<button type=\"submit\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 30px; background: #2F5F7E; color: #FFFFFF; font: 600 16px/1 'IBM Plex Sans', system-ui, sans-serif; border: 0; border-radius: 6px; cursor: pointer\">Send<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fform>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Footer -->\n<div style=\"background: #16212B; color: #9FB4C4; border-top: 1px solid #2C3E4D\">\n<div style=\"max-width: 1160px; margin: 0 auto; width: 100%; box-sizing: border-box; padding: 24px 24px 32px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 32px; font-size: 14px; line-height: 1.5\">\n<div>Techsavey · West Orange, New Jersey · Technical work since 2003<\u002Fdiv>\n<div>Client names and data stay private.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:2900}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\u002Fscript>\n<script>\n// Contact form. Sends through Web3Forms once data-access-key on the form is filled in;\n// until then it opens the visitor's email app with the message filled in.\ndocument.addEventListener('submit', function (e) {\n  var form = e.target;\n  if (!form || form.id !== 'ts-contact-form') return;\n  e.preventDefault();\n  var status = document.getElementById('ts-contact-status');\n  function say(msg, isError) {\n    status.textContent = msg;\n    status.style.color = isError ? '#A3261B' : '#424C55';\n  }\n  var name = form.elements.name, email = form.elements.email;\n  [name, email].forEach(function (f) { f.removeAttribute('aria-invalid'); });\n  if (!name.value.trim()) { name.setAttribute('aria-invalid', 'true'); name.focus(); say('Please enter your name.', true); return; }\n  if (!email.validity.valid || !email.value.trim()) { email.setAttribute('aria-invalid', 'true'); email.focus(); say('Please enter a valid email address.', true); return; }\n\n  var data = {\n    name: name.value.trim(),\n    email: email.value.trim(),\n    subject: form.elements.subject.value.trim(),\n    message: form.elements.message.value.trim()\n  };\n  var key = form.getAttribute('data-access-key');\n  if (key) {\n    var btn = form.querySelector('button[type=\"submit\"]');\n    btn.disabled = true;\n    say('Sending…');\n    var payload = {\n      access_key: key,\n      from_name: 'Techsavey website',\n      subject: data.subject || 'Website inquiry from ' + data.name,\n      name: data.name,\n      email: data.email,\n      message: data.message,\n      botcheck: form.elements.botcheck.checked\n    };\n    fetch(form.getAttribute('data-endpoint'), { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(payload) })\n      .then(function (r) { return r.json(); })\n      .then(function (res) {\n        if (!res.success) throw new Error(res.message);\n        form.reset();\n        say('Thank you. Your message was sent and Techsavey will reply soon.');\n      })\n      .catch(function () {\n        say('The message could not be sent. Please email jforeman@techsavey.com instead.', true);\n      })\n      .then(function () { btn.disabled = false; });\n    return;\n  }\n  var body = data.message + '\\n\\n' + data.name + '\\n' + data.email;\n  window.location.href = 'mailto:' + form.getAttribute('data-mailto') +\n    '?subject=' + encodeURIComponent(data.subject || 'Website inquiry from ' + data.name) +\n    '&body=' + encodeURIComponent(body);\n  say('Your email app should open with the message ready to send.');\n}, true);\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
